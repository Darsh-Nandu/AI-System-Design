version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guardrails
      POSTGRES_PASSWORD: guardrails
      POSTGRES_DB: guardrails
    ports:
      - "5438:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "guardrails"]
      interval: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.0
    ports:
      - "9096:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3005:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  api:
    build:
      context: .
      target: api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://guardrails:guardrails@postgres:5432/guardrails
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  grafana_data:
