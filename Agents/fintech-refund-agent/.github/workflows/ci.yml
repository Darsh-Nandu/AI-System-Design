name: CI - Fintech Refund Agent

on:
  push:
    branches: [main]
    paths:
      - "Agents/fintech-refund-agent/**"
  pull_request:
    branches: [main]
    paths:
      - "Agents/fintech-refund-agent/**"

defaults:
  run:
    working-directory: Agents/fintech-refund-agent

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.10"

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.10"

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run unit tests
        env:
          ANTHROPIC_API_KEY: "sk-ant-test-placeholder"
        run: uv run pytest tests/unit -v --cov=src --cov-report=xml --cov-fail-under=70

      - uses: codecov/codecov-action@v4
        with:
          files: Agents/fintech-refund-agent/coverage.xml
          flags: unit
        continue-on-error: true

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: refund_agent
          POSTGRES_USER: refund
          POSTGRES_PASSWORD: refund_secret
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U refund -d refund_agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.10"

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run integration tests
        env:
          ANTHROPIC_API_KEY: "sk-ant-test-placeholder"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5433
          REDIS_URL: redis://localhost:6380/0
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: uv run pytest tests/integration -v -m integration

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: Agents/fintech-refund-agent
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
