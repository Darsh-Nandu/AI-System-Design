[project]
name = "eval-pipeline"
version = "0.1.0"
description = "Coding assistant eval pipeline for model upgrade regression detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # LLM
    "anthropic>=0.42.0",
    # Embeddings
    "sentence-transformers>=3.3.0",
    "numpy>=2.0.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Storage
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    # Config + models
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # Observability
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    # Utilities
    "orjson>=3.10.0",
    "typer>=0.13.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
eval-api = "eval_pipeline.api.main:run"
eval-run = "eval_pipeline.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=75"
