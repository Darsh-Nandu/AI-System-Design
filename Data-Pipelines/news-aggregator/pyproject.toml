[project]
name = "news-aggregator"
version = "0.1.0"
description = "Production news aggregation pipeline: Kafka → spaCy → Qdrant → FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Async Kafka
    "aiokafka>=0.11.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Vector DB
    "qdrant-client[fastembed]>=1.12.0",
    # Cache
    "redis[asyncio]>=5.2.0",
    # NLP + Embeddings
    "spacy>=3.8.0",
    "sentence-transformers>=3.3.0",
    # RSS scraping
    "feedparser>=6.0.11",
    "aiohttp>=3.11.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    # Config + Models
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    # Observability
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    # Utilities
    "tenacity>=9.0.0",
    "httpx>=0.28.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
    "types-feedparser>=6.0.1",
]

[project.scripts]
aggregator-api = "news_aggregator.api.main:run"
aggregator-worker = "news_aggregator.workers.consumer:run"
aggregator-producer = "news_aggregator.ingestion.producer:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_aggregator"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src"]
omit = ["*/migrations/*"]
