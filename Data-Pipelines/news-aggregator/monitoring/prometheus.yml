global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "news-api"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: /metrics

  - job_name: "news-worker"
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: "news-producer"
    static_configs:
      - targets: ["host.docker.internal:9101"]

  - job_name: "qdrant"
    static_configs:
      - targets: ["qdrant:6333"]
    metrics_path: /metrics

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]

  - job_name: "redpanda"
    static_configs:
      - targets: ["redpanda:9644"]
    metrics_path: /metrics
