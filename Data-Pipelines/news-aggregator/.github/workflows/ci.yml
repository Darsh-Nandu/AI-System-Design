name: CI

on:
  push:
    branches: [main]
    paths:
      - "Data-Pipelines/news-aggregator/**"
  pull_request:
    branches: [main]
    paths:
      - "Data-Pipelines/news-aggregator/**"

defaults:
  run:
    working-directory: Data-Pipelines/news-aggregator

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.10"

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Mypy
        run: uv run mypy src

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.10"

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"
          python -m spacy download en_core_web_sm

      - name: Run unit tests
        run: uv run pytest tests/unit -v --cov=src --cov-report=xml --cov-fail-under=75

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: Data-Pipelines/news-aggregator/coverage.xml
          flags: unit
        continue-on-error: true

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: news_aggregator
          POSTGRES_USER: news
          POSTGRES_PASSWORD: news_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U news -d news_aggregator"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.12.5
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.10"

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"
          python -m spacy download en_core_web_sm

      - name: Run integration tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: news_aggregator
          POSTGRES_USER: news
          POSTGRES_PASSWORD: news_secret
          REDIS_URL: redis://localhost:6379/0
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: uv run pytest tests/integration -v -m integration

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: Data-Pipelines/news-aggregator
          target: worker
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: Data-Pipelines/news-aggregator
          target: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
