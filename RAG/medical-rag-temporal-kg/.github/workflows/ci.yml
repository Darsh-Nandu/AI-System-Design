name: medical-rag-temporal-kg CI

on:
  push:
    paths:
      - "RAG/medical-rag-temporal-kg/**"
  pull_request:
    paths:
      - "RAG/medical-rag-temporal-kg/**"

defaults:
  run:
    working-directory: RAG/medical-rag-temporal-kg

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Mypy type check
        run: mypy src/

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Run unit tests
        run: SKIP_INTEGRATION=1 pytest tests/unit -v --tb=short --no-cov

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medical
          POSTGRES_PASSWORD: medical
          POSTGRES_DB: medical_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.9.0
        ports:
          - 6333:6333
      neo4j:
        image: neo4j:5.18-community
        env:
          NEO4J_AUTH: neo4j/medical_rag_password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "neo4j status"
          --health-interval 10s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://medical:medical@localhost:5432/medical_rag
      QDRANT_URL: http://localhost:6333
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: medical_rag_password
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SKIP_INTEGRATION: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Run integration tests
        run: pytest tests/integration -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: RAG/medical-rag-temporal-kg
          target: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
